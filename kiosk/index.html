<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="robots" content="noindex,nofollow">
<meta name="theme-color" content="#fbfaf5">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">

<title>라임라잇 출석</title>

<!-- 출석 키패드(지시서 045 1차). 원본: 비공개 저장소 web/kiosk/ → 공개 저장소 kiosk/ 로 그대로 복사(빌드 없음).
     학생 정보는 이 파일에 없다. 기기 열쇠로 빠른 서버(kiosk)에서 받은 명부만 이 기기 안에 둔다. 예시 = 김라임. -->
<style>
:root{--bg:#fbfaf5;--panel:#f3f1e6;--key:#fff;--keyt:#1e2a38;--keyp:#ecebdd;--fn:#efeadb;--g:#7cc242;--g2:#1e2a38;--lime:#7cc242;--ok:#2e9d57;--pu:#7a5bc4;--o:#e08a1e;--r:#d9493d;--t:#1e2a38;--m:#7d8794;--line:#e6e3d3;--gap:1.6vh;--out:2.5vh}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;-webkit-user-select:none;user-select:none}
html,body{margin:0;height:100%;overflow:hidden}
body{background:var(--bg);color:var(--t);font-family:Pretendard,-apple-system,"Apple SD Gothic Neo","Malgun Gothic",system-ui,sans-serif;touch-action:manipulation;border-top:.8vh solid var(--lime)}
.app{display:grid;grid-template-columns:50fr 50fr;height:calc(100vh - .8vh);height:calc(100dvh - .8vh);gap:0}
.tl{display:flex;flex-direction:column;min-height:0;min-width:0;position:relative;flex:1;padding:0 0 0 .4vh}
.tlc{flex:1;overflow-y:auto;overflow-x:hidden;-webkit-overflow-scrolling:touch;scrollbar-width:none;padding:0 var(--out) 6vh 0;touch-action:pan-y}
.tlc::-webkit-scrollbar{display:none}
.tl ol{list-style:none;margin:0;padding:0 0 0 3.4vh;position:relative}
.tl ol::before{content:"";position:absolute;left:1.05vh;top:1vh;bottom:0;width:.4vh;background:#e2dfcb;border-radius:1vh}
.tl li{position:relative;margin-bottom:2.2vh}
.tl li::before{content:"";position:absolute;left:-3.4vh;top:.1vh;width:2.2vh;height:2.2vh;border-radius:50%;background:#fff;border:.35vh solid #e2dfcb}
.tl .tm{font-size:clamp(12px,2vh,20px);font-weight:700;color:var(--t);font-variant-numeric:tabular-nums;line-height:2.4vh;margin-bottom:.8vh}
.tl .bb{display:inline-flex;align-items:center;gap:1vh;background:#fff;border-radius:1.6vh;padding:1vh 1.6vh;font-size:clamp(14px,2.6vh,26px);font-weight:700;box-shadow:0 .2vh .6vh rgba(60,50,20,.08);max-width:100%}
.tl .bb span.n{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tl .ch{flex:none;font-size:clamp(10px,1.6vh,16px);font-weight:700;color:#fff;border-radius:99px;padding:.3vh 1vh;background:var(--ok)}
.tl .ch.out{background:var(--pu)}
.tl .emp{color:var(--m);font-size:clamp(12px,2vh,20px);font-weight:600}
.tl .more{position:absolute;left:0;right:0;bottom:0;height:7vh;background:linear-gradient(to bottom,rgba(255,255,255,0),#fff 70%);color:#a9a58f;text-align:center;font-size:clamp(10px,1.6vh,16px);font-weight:600;padding-top:3vh;pointer-events:none;display:none}
.tl .more.on{display:block}
.mid{display:flex;flex-direction:column;align-items:center;justify-content:center;padding:var(--out) var(--out) 6vh;min-width:0;min-height:0}
.logo{height:18vh;max-width:60%;object-fit:contain;display:block}
.date{font-size:clamp(18px,4vh,44px);color:#4b5563;text-align:center;margin-top:3vh;font-weight:700}
.clock{font-size:min(18vh,12vw);font-weight:800;font-variant-numeric:tabular-nums;letter-spacing:-.02em;line-height:1;text-align:center;margin-top:1.2vh}
.stage{flex:none;display:flex;align-items:center;justify-content:center;height:21vh;width:100%;margin-top:2vh;overflow:visible} /* 킴쌤 11/5 02:29: 입력·결과가 같은 자리, 다른 것 위치 안 바뀜 — 높이 고정 */
.hint{font-size:clamp(14px,2.4vh,26px);color:var(--m);text-align:center;font-weight:600;line-height:1.4;margin-top:1.4vh}
.num{font-size:min(11vh,7vw);font-weight:800;font-variant-numeric:tabular-nums;letter-spacing:.08em;text-align:center;min-height:1.2em;color:var(--t);display:flex;justify-content:center;align-items:center}
.num::after{content:"";display:inline-block;width:.07em;height:.95em;background:var(--lime);margin-left:.1em;animation:cur 1s steps(1) infinite}
@keyframes cur{50%{opacity:0}}
.res{text-align:center;width:100%}
.res1{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1.4vh;min-height:1.2em;font-size:min(11vh,7vw);line-height:1.2}
.res1 .kind{margin:0;font-size:min(6vh,4.2vw);padding:.5vh 2.6vh}
.res1 .nm{font-size:inherit;font-weight:800;line-height:1.1;white-space:nowrap}
.res2{display:flex;align-items:center;justify-content:center;gap:2vh;margin-top:1.4vh;font-size:clamp(14px,2.4vh,26px);line-height:1.4;color:var(--m);font-weight:700}
.res2 .cancel{margin:0;height:auto;min-height:0;padding:.4vh 2.4vh;border-radius:99px;font-size:inherit;border-width:.25vh}

.res .nm{font-size:min(8vh,6vw);font-weight:800;line-height:1.1;word-break:keep-all}
.res .kind{display:inline-block;margin-top:2vh;font-size:min(5.4vh,4vw);font-weight:800;padding:.6vh 3vh;border-radius:999px;background:var(--ok);color:#fff}
.res .kind.out{background:var(--pu)}
.res.stf .nm{color:#1f6b3f}
.pick button.stf{background:#dff2e4}
.res .tm{font-size:min(4vh,3vw);color:var(--m);font-weight:700;margin-top:1.4vh;font-variant-numeric:tabular-nums}
.res .cls{font-size:clamp(14px,2.4vh,24px);color:var(--m);margin-top:1vh}
.res.warn .nm{font-size:min(6vh,4.6vw)}
.res.warn .msg{font-size:min(3.2vh,2.4vw);color:var(--o);font-weight:700;margin-top:1.6vh}
.cancel{margin-top:2.4vh;height:7vh;min-height:48px;padding:0 4vh;border-radius:1.8vh;border:.3vh solid var(--m);background:#fff;color:var(--t);font-size:clamp(16px,2.8vh,28px);font-weight:800}
.pick{display:flex;flex-wrap:wrap;gap:1.6vh;justify-content:center;margin-top:2vh}
.pick button{min-width:18vh;height:10vh;min-height:64px;border-radius:2vh;border:0;background:var(--key);color:var(--keyt);font-size:clamp(20px,4vh,42px);font-weight:800;padding:0 2.4vh;box-shadow:0 .2vh .8vh rgba(60,50,20,.14)}
.pick button small{display:block;font-size:.45em;color:#6b7a70;font-weight:700}
.pick .back{background:transparent;border:.3vh solid var(--m);color:var(--t);font-size:clamp(16px,2.8vh,28px);box-shadow:none}
.ttl{font-size:clamp(20px,3.6vh,36px);font-weight:800;text-align:center}
.right{--k:min(14vh,12.5vw);display:grid;grid-template-columns:repeat(3,var(--k));grid-template-rows:repeat(4,var(--k));gap:var(--gap);justify-content:center;align-content:center;padding:var(--out) var(--out) calc(var(--out) + 2vh);min-height:0}
.right button{border:0;border-radius:2.2vh;background:var(--key);color:var(--keyt);font-size:5.5vh;font-weight:700;font-variant-numeric:tabular-nums;box-shadow:0 .3vh 1vh rgba(60,50,20,.12);transition:background .05s;min-height:0;min-width:0;padding:0}
.right button:active,.right button.pr{background:var(--keyp);box-shadow:0 .1vh .3vh rgba(60,50,20,.12)}
.right button.go{background:var(--lime);color:#1f4a12;font-size:3.6vh;font-weight:800;letter-spacing:.1em;box-shadow:0 .3vh 1vh rgba(60,110,20,.25)}
.right button.go:active,.right button.go.pr{background:#6aae34}
.right button.fn{background:var(--fn);color:var(--t);font-size:3vh;font-weight:700;box-shadow:none}
.right button[data-k="B"] svg{width:7.5vh;height:auto;display:block;margin:auto;color:#3d6e1e}
.right button.fn:active,.right button.fn.pr{background:#e2dcc7}
.bar{display:none;position:fixed;left:0;width:40vw;bottom:1.6vh;gap:12px;align-items:center;justify-content:center;font-size:clamp(11px,1.8vh,15px);font-weight:700;color:var(--r);pointer-events:none}
.bar .dot{width:10px;height:10px;border-radius:50%;background:var(--m);display:inline-block;margin-right:6px;vertical-align:-1px}
.bar .dot.ok{background:var(--ok)}.bar .dot.bad{background:var(--r)}
.test{position:fixed;left:0;top:0;padding:6px 14px;background:var(--r);color:#fff;font-weight:800;font-size:14px;border-bottom-right-radius:12px;display:none;z-index:5}
body.is-test .test{display:block}
.tlb{position:fixed;left:max(2.5vh,env(safe-area-inset-left,0px));bottom:calc(2.5vh + env(safe-area-inset-bottom,0px));z-index:5;margin:0;height:6vh;min-height:40px;padding:0 3vh;border-radius:99px;border:.25vh solid var(--g2);background:transparent;color:var(--g2);font-size:clamp(13px,2.2vh,22px);font-weight:700}
.tlb:active{background:var(--keyp)}
.pop{position:fixed;inset:0;background:rgba(30,42,56,.55);display:none;align-items:center;justify-content:center;z-index:8}
.pop.on{display:flex}
.pop .card{width:60vw;height:80vh;background:#fff;border-radius:2.6vh;box-shadow:0 1vh 4vh rgba(0,0,0,.25);display:flex;flex-direction:column;padding:2.6vh 3vh 0;min-width:0}
.pop .hd{display:flex;align-items:center;justify-content:space-between;margin-bottom:2vh}
.pop h3{margin:0;font-size:clamp(18px,3.4vh,34px);font-weight:800}
.pop .x{border:0;background:var(--fn);color:var(--t);width:6vh;height:6vh;border-radius:50%;font-size:clamp(16px,2.8vh,28px);font-weight:700;padding:0}
.set{position:fixed;inset:0;background:rgba(30,42,56,.55);display:none;align-items:center;justify-content:center;z-index:9}
.set.on{display:flex}
.set .box{background:#fff;color:#1e2a38;border-radius:18px;padding:26px 24px;width:min(440px,92vw);-webkit-user-select:text;user-select:text}
.set h2{margin:0 0 16px;font-size:24px;text-align:center}
.set label{display:block;font-weight:700;margin:12px 0 6px;font-size:15px}
.set input[type=text],.set input[type=password]{width:100%;height:46px;border:1px solid #d8ded9;border-radius:12px;padding:0 12px;font-size:17px}
.set .devs{display:flex;gap:8px}.set .devs button{flex:1;height:46px;border-radius:12px;border:1px solid #d8ded9;background:#fff;font-size:18px;font-weight:800}
.set .devs button.on{background:#1e2a38;color:#fff;border-color:#1e2a38}
.set .row{display:flex;gap:8px;align-items:center;margin-top:14px;font-weight:700}
.set .go{width:100%;height:50px;margin-top:20px;border:0;border-radius:12px;background:var(--lime);color:#1e2a38;font-size:18px;font-weight:800}
.set .err{color:#c62828;font-weight:700;text-align:center;min-height:1.2em;margin-top:10px;font-size:14px}
.set .info{font-size:13px;color:#6b7480;text-align:center;margin-top:8px}
.lg{background:var(--bg)}.lg .go:disabled{opacity:.5}
.bar .lo{pointer-events:auto;border:0;background:transparent;color:var(--m);font-size:13px;text-decoration:underline;padding:4px 2px;display:none}
body:not(.has-lt) #bLo{display:none}
@media (orientation:portrait){
.app{grid-template-columns:1fr;grid-template-rows:auto 1fr}
#tlb{display:none!important}
.mid{padding:3vh 16px 2vh}
.clock{font-size:min(10vh,16vw)}.num{font-size:min(8vh,10vw)}.logo{height:8vh}.stage{min-height:10vh}.date{margin-top:2vh}.mid{justify-content:flex-start}
.res .nm{font-size:min(7vh,9vw)}.res .kind{font-size:min(5vh,7vw)}.res .tm{font-size:min(3.6vh,5vw)}.res.warn .msg{font-size:min(3vh,4.4vw)}.res.warn .nm{font-size:min(5.6vh,7vw)}
.right{--k:min(9.5vh,20vw);grid-template-rows:repeat(4,var(--k));padding:0 var(--out) calc(var(--out) + 2vh);min-height:0;align-content:start}
.bar{left:0;width:100%}
}
</style>
</head>
<body>
<div class="test">시험 모드 · 예시 명부</div>
<div class="app">
  <div class="mid">
    <img class="logo" src="logo.png" alt="" id="brand">
    <div class="date" id="date"></div>
    <div class="clock" id="clock">--:--</div>
    <div class="stage" id="stage"></div>
    <button class="tlb" id="tlb" type="button">오늘 기록 0</button>
  </div>
  <div class="right" id="pad"></div>
</div>
<div class="pop" id="pop"><div class="card"><div class="hd"><h3>오늘 등하원</h3><button class="x" id="popX" type="button">✕</button></div><div class="tl"><div class="tlc" id="tlc"><ol id="tlo"></ol></div><div class="more" id="tlm">▼ 밀어서 이전 기록</div></div></div></div>
<div class="bar" id="bar"><span><i class="dot bad"></i><span id="bNet"></span></span></div>
<div class="set lg" id="lg"><div class="box">
  <h2>라임라잇 출석</h2>
  <label for="lId">아이디</label><input type="text" id="lId" autocomplete="username" autocapitalize="off" spellcheck="false">
  <label for="lPw">비밀번호</label><input type="password" id="lPw" autocomplete="current-password">
  <button class="go" id="lGo" type="button">로그인</button>
  <div class="err" id="lErr"></div>
</div></div>
<div class="set" id="set"><div class="box">
  <h2>키패드 설정</h2>
  <label>기기 번호</label><div class="devs" id="sDev"></div>
  <label>기기 열쇠</label><input type="password" id="sKey" autocomplete="off" placeholder="관제탑에서 받은 열쇠">
  <div class="row"><input type="checkbox" id="sTest"><label for="sTest" style="margin:0">시험 모드(예시 명부 · 시험 탭에만 기록)</label></div>
  <label>서버 주소</label><input type="text" id="sApi" autocomplete="off">
  <div class="info" style="margin:12px 0 0"><div id="sInfo"></div><span id="sRos"></span> · <button type="button" id="sRe" style="border:0;background:transparent;color:#6b7480;text-decoration:underline;font-size:13px">명부 다시 받기</button> · <button type="button" id="bLo" style="border:0;background:transparent;color:#6b7480;text-decoration:underline;font-size:13px">로그아웃</button></div>
  <button class="go" id="sGo">저장하고 시작</button>
  <div class="err" id="sErr"></div>
  <div class="info">설정 다시 열기: 시계를 3초 누르기</div>
</div></div>
<script>
/* 첫 터치마다 전체화면 요청(안드로이드 크롬). 실패·미지원은 조용히 무시, 나갔다 오면 다음 터치에 다시 */

d.addEventListener("pointerdown",go,true);d.addEventListener("click",go,true);})();
</script>

  function popOpen() { return $('pop').classList.contains('on'); }
  function popClose() { clearTimeout(popT); $('pop').classList.remove('on'); }
  function popTouch() { clearTimeout(popT); popT = setTimeout(popClose, 15000); }
  $('tlb').addEventListener('click', function () { tlSync(); tlDraw(); $('pop').classList.add('on'); $('tlc').scrollTop = 0; tlMore(); popTouch(); });
  $('popX').addEventListener('click', popClose);
  $('pop').addEventListener('click', function (e) { if (e.target === $('pop')) popClose(); });
  ['pointerdown', 'touchmove', 'wheel'].forEach(function (ev) { $('pop').addEventListener(ev, function () { if (popOpen()) popTouch(); }, { passive: true }); });
  $('tlc').addEventListener('scroll', function () { tlMore(); if (popOpen()) popTouch(); });
  function bar() {
    if (!K) return;
    var n = K.S.net, p = K.pending(), bad = n.ok === false; // 킴쌤 11/5 02:41 '보낼 줄 n'은 안 보임 — 연결 끊김일 때만
    $('bar').style.display = bad ? 'flex' : 'none';
    $('bNet').textContent = '연결 끊김';

    if ($('sRos')) { $('sRos').textContent = '명부 ' + K.count() + '명' + (K.staffCount() ? ' · 직원 ' + K.staffCount() + '명' : ''); $('sInfo').textContent = '기기 ' + (cfg.dev || '?') + ' · 보낼 줄 ' + p + ' · ' + (n.ok === true ? '연결됨' : n.ok === false ? '연결 끊김' : '연결 확인 중'); }
  }
  function draw() {
    var h = '';
    if (view.kind === 'idle') {
      h = '<div><div class="num" id="num">' + esc(buf) + '</div><div class="hint">' + (K && K.count() ? '출결번호를 입력하세요' : '명부 받는 중…') + '</div></div>';
    } else if (view.kind === 'pick') {
      h = '<div style="width:100%"><div class="ttl">이름을 눌러 주세요</div><div class="pick">' + view.list.map(function (s, i) { return '<button data-pick="' + i + '"' + (s.st ? ' class="stf"' : '') + '>' + esc(s.nm) + (s.st ? '<small>선생님</small>' : s.c ? '<small>' + esc(s.c) + '</small>' : '') + '</button>'; }).join('') + '<button class="back" data-back="1">다시 입력</button></div></div>';
    } else if (view.kind === 'done') {
      // 킴쌤 11/5 02:28: 입력 숫자 자리에 '등원 ✓ 김라임' 한 줄 + 아래 작은 줄(시각·취소) — 다른 것 위치 그대로
      var out = view.t === '하원' || view.t === '퇴근';
      h = '<div class="res' + (view.s.st ? ' stf' : '') + '"><div class="res1"><span class="kind' + (out ? ' out' : '') + '">' + view.t + ' ✓</span><span class="nm">' + esc(view.s.nm) + (view.s.st ? ' 선생님' : '') + '</span></div>'
        + '</div>'; // 킴쌤 02:30 취소 필요 없음 · 02:36 '등원 ✓' 위 · 이름 아래 두 줄
    } else if (view.kind === 'ign') {
      h = '<div class="res warn"><div class="nm">' + esc(view.s.nm) + '</div><div class="msg">방금 ' + view.last.t + ' 처리됐어요 (' + KioskCore.kst(view.last.at).hm + ')</div></div>';
    } else if (view.kind === 'none') {
      h = '<div class="res warn"><div class="nm">' + esc(view.code) + '</div><div class="msg">없는 번호예요. 다시 눌러 주세요</div></div>';
    } else if (view.kind === 'cancelled') {
      h = '<div class="res warn"><div class="nm">취소했어요</div></div>';
    }
    $('stage').innerHTML = h; tick(); bar();
  }
  function back(ms) { clearTimeout(resetT); resetT = setTimeout(function () { view = { kind: 'idle' }; buf = ''; draw(); }, ms); }
  function choose(s) {
    var t0 = performance.now(), r = K.commit(s);
    if (r.ignored) { view = { kind: 'ign', s: s, last: r.last }; beep('x'); back(2500); }
    else { var hd = s.st ? 2000 : KioskCore.HOLD; view = { kind: 'done', s: s, t: r.t, hm: r.hm, key: r.rec.key, until: Date.now() + hd, left: hd / 1000 }; beep(r.t === '하원' || r.t === '퇴근' ? 'out' : 'in'); back(hd); }
    draw();
    if (r.rec) tlAdd(r.rec);
    window.__kiosk.log.push({ ms: performance.now() - t0, n: s.n, t: r.ignored ? 'ign' : r.t, key: r.rec ? r.rec.key : '' });
  }
  function enter(code) {
    var t0 = performance.now(), L = K.lookup(code);
    if (!L.length) { view = { kind: 'none', code: code }; beep('x'); back(2000); draw(); window.__kiosk.log.push({ ms: performance.now() - t0, t: 'none' }); return; }
    if (L.length === 1) return choose(L[0]);
    view = { kind: 'pick', list: L }; clearTimeout(resetT); back(15000); draw(); window.__kiosk.log.push({ ms: performance.now() - t0, t: 'pick' });
  }
  var idleT = null;
  function key(k) {
    if (!K) return;
    if (popOpen()) return; // 팝업이 떠 있는 동안 숫자 입력 막음
    if (view.kind === 'pick') return;
    if (view.kind !== 'idle') { clearTimeout(resetT); view = { kind: 'idle' }; buf = ''; }
    clearTimeout(idleT);
    if (k === 'C') buf = ''; else if (k === 'B') buf = buf.slice(0, -1);
    else if (k === 'E') { if (!buf) return; var c = buf; buf = ''; return enter(c); } // 112: ↵로 판정(자동 판정 없음)
    else if (buf.length < 8) buf += k;
    if (buf) idleT = setTimeout(function () { buf = ''; if (view.kind === 'idle') draw(); }, 5000); // 5초 안 누르면 비움
    draw();
  }
  // 키패드
  var pad = $('pad');
  ['1', '2', '3', '4', '5', '6', '7', '8', '9', 'C', '0', 'E'].forEach /* 킴쌤 11/5 02:37 입력을 ← 자리로(← 버튼 없음, 키보드 Backspace는 그대로) */(function (k) {
    var b = document.createElement('button'); b.dataset.k = k; if (k === 'B') b.innerHTML = '<svg viewBox="0 0 64 40" aria-label="한 글자 지우기"><path d="M4 20 L24 4 L24 13 L60 13 L60 27 L24 27 L24 36 Z" fill="none" stroke="currentColor" stroke-width="4.5" stroke-linejoin="round"/></svg>'; else b.textContent = k === 'C' ? '지우기' : k === 'E' ? '입력' : k; if (k === 'C' || k === 'B') b.className = 'fn'; if (k === 'E') b.className = 'go'; pad.appendChild(b); // 킴쌤 11/5 02:30: ↵ → '입력', ← 크게
  });
  pad.addEventListener('pointerdown', function (e) { var b = e.target.closest('button'); if (!b) return; e.preventDefault(); b.classList.add('pr'); setTimeout(function () { b.classList.remove('pr'); }, 90); key(b.dataset.k); });
  document.addEventListener('keydown', function (e) { if (/^[0-9]$/.test(e.key)) key(e.key); else if (e.key === 'Backspace') key('B'); else if (e.key === 'Enter') key('E'); else if (e.key === 'Escape') key('C'); });
  $('stage').addEventListener('click', function (e) {
    var p = e.target.closest('[data-pick]'), bk = e.target.closest('[data-back]'), c = e.target.closest('[data-cancel]');
    if (p && view.kind === 'pick') return choose(view.list[+p.dataset.pick]);
    if (bk) { view = { kind: 'idle' }; buf = ''; draw(); }
    if (c && view.kind === 'done') { if (K.cancel(view.key)) { tlDel(view.key); view = { kind: 'cancelled' }; back(1500); draw(); } }
  });
  // 설정 — 시계 3초 누르기
  var lp = null;
  $('clock').addEventListener('pointerdown', function () { lp = setTimeout(openSet, 3000); });
  ['pointerup', 'pointerleave', 'pointercancel'].forEach(function (ev) { $('clock').addEventListener(ev, function () { clearTimeout(lp); }); });
  function openSet() {
    $('sDev').innerHTML = [1, 2, 3, 4, 5].map(function (d) { return '<button data-d="' + d + '" class="' + (String(cfg.dev) === String(d) ? 'on' : '') + '">' + d + '</button>'; }).join('');
    $('sKey').value = cfg.key || ''; $('sTest').checked = !!cfg.test; $('sApi').value = cfg.api || FAST; $('sErr').textContent = ''; $('set').classList.add('on'); bar();
  }
  $('sRe').addEventListener('click', function () { if (K) K.syncRoster().then(function () { bar(); draw(); }); });
  $('sDev').addEventListener('click', function (e) { var b = e.target.closest('button'); if (!b) return; [].forEach.call($('sDev').children, function (x) { x.classList.toggle('on', x === b); }); });
  $('sGo').addEventListener('click', function () {
    var on = $('sDev').querySelector('.on'); if (!on) { $('sErr').textContent = '기기 번호를 골라 주세요'; return; }
    var test = $('sTest').checked, k = $('sKey').value.trim(); if (!test && !k) { $('sErr').textContent = '기기 열쇠를 넣어 주세요'; return; }
    cfg = { dev: on.dataset.d, key: k, test: test, api: $('sApi').value.trim() || FAST }; LS.set('kiosk_cfg', JSON.stringify(cfg)); location.replace(location.pathname);
  });
  function post(body) {
    var ctl = typeof AbortController !== 'undefined' ? new AbortController() : null, to = setTimeout(function () { if (ctl) ctl.abort(); }, 15000);
    return fetch(cfg.api || FAST, { method: 'POST', headers: { 'Content-Type': 'text/plain;charset=utf-8' }, body: JSON.stringify(body), signal: ctl ? ctl.signal : undefined })
      .then(function (r) { return r.json(); }).finally(function () { clearTimeout(to); });
  }
  // 107: 로그인 화면
  function dropLt() { LT = null; LS.del('kiosk_lt'); document.body.classList.remove('has-lt'); }
  function showLogin(msg, setup) {
    $('lErr').textContent = setup ? '관리자 설정 필요' : (msg || ''); $('lGo').disabled = !!setup; $('lPw').value = '';
    $('set').classList.remove('on'); $('lg').classList.add('on');
  }
  var LERR = { bad: '아이디 또는 비밀번호가 맞지 않아요', lock: '여러 번 틀려 10분 동안 잠겼어요', setup: '관리자 설정 필요', busy: '서버 연결이 잠시 안 돼요 · 다시 눌러 주세요' };
  function doLogin() {
    var id = $('lId').value.trim(), pw = $('lPw').value; if (!id || !pw) { $('lErr').textContent = '아이디와 비밀번호를 넣어 주세요'; return; }
    $('lGo').disabled = true; $('lErr').textContent = '확인 중…';
    post({ a: 'kiosk', op: 'login', id: id, pw: pw, dev: String(cfg.dev || '') }).then(function (j) {
      $('lGo').disabled = false;
      if (!j || !j.ok || !j.lt) { $('lErr').textContent = LERR[j && j.error] || LERR.busy; if (j && j.error === 'setup') $('lGo').disabled = true; $('lPw').value = ''; return; }
      LT = { lt: j.lt, exp: +j.exp || Date.now() + 30 * 864e5 }; LS.set('kiosk_lt', JSON.stringify(LT)); LS.set('kiosk_lon', '1');
      document.body.classList.add('has-lt'); $('lPw').value = ''; $('lErr').textContent = ''; $('lg').classList.remove('on');
      if (!K) start(); else draw();
    }, function () { $('lGo').disabled = false; $('lErr').textContent = LERR.busy; });
  }
  $('lGo').addEventListener('click', doLogin);
  $('lPw').addEventListener('keydown', function (e) { if (e.key === 'Enter') doLogin(); });
  $('bLo').addEventListener('click', function () { if (!confirm('로그아웃할까요?')) return; dropLt(); showLogin(''); });
  // 처음 열 때: 살아 있는 토큰이 있으면 바로 키패드(서버 확인은 뒤에서), 없으면 서버에 로그인이 필요한지 묻고 기다림
  function auth() { return post({ a: 'kiosk', op: 'auth', lt: ltNow() }).then(function (j) { if (!j || !j.ok) throw new Error('auth'); if (j.known) LS.set('kiosk_lon', j.on || j.must ? '1' : '0'); return j; }); }
  function judge(j) { if (j.on && !j.valid) { dropLt(); showLogin(''); return false; } if (!j.on && j.must) { showLogin('', true); return false; } return true; }
  function boot() {
    document.body.classList.toggle('is-test', !!cfg.test);
    if (cfg.test) return start(); // 시험 모드(예시 명부)는 로그인 없음
    if (ltNow()) { document.body.classList.add('has-lt'); start(); auth().then(judge, function () {}); return; }
    $('stage').innerHTML = '<div class="hint">연결 중…</div>';
    auth().then(function (j) { if (judge(j)) start(); }, function () { if (LS.get('kiosk_lon') === '1') showLogin('서버 연결이 안 돼요 · 잠시 뒤 로그인해 주세요'); else start(); }); // 연결이 안 되면: 전에 로그인이 켜져 있던 기기만 막음
  }
  function start() {
    if (K) return;
    if (!cfg.dev || (!cfg.test && !cfg.key)) { draw(); openSet(); return; }
    K = KioskCore.create({ post: post, store: LS, now: now, dev: cfg.dev, key: cfg.key, lt: ltNow, test: !!cfg.test, onChange: bar, onLogin: function () { if ($('lg').classList.contains('on')) return; dropLt(); showLogin('다시 로그인해 주세요'); } });
    draw();
    var first = function () { K.syncRoster().then(function (ok) { draw(); if (!ok && !K.count()) setTimeout(first, 3000); }); };
    first();
    setInterval(function () { K.syncRoster(); }, cfg.test ? 10000 : 20000); // 다른 태블릿이 찍은 그날 상태 + 명부 바뀜(같으면 목록은 안 옴)
    K.start();
    try { if (navigator.wakeLock) { var wl = function () { navigator.wakeLock.request('screen').catch(function () {}); }; wl(); document.addEventListener('visibilitychange', function () { if (!document.hidden) wl(); }); } } catch (e) {}
  }
  setInterval(tick, 500);
  boot();
})();
</script>
</body>
</html>
