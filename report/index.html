<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<meta name="referrer" content="no-referrer">
<meta name="theme-color" content="#24308f">
<title>내신 학습 보고서</title>
<!-- 학부모 내신 주차 보고서 (킴쌤 11/17). 원본: 비공개 저장소 web/report/ → 보고서 전용 공개 저장소 Limelight-smart/report 로 그대로 복사(빌드 없음, 주소 report.limelight-smart.co.kr).
     학생 정보는 이 파일에 없다. 주소의 ?k=열쇠로 서버(선생님앱_API a=rpt)에 물어 받은 자료(JSON)를 이 파일이 폰 화면으로 그린다. 열쇠가 틀리거나 기간이 지나면 같은 안내. -->
<link rel="stylesheet" href="report.css?v=1117b">
</head>
<body>
<div id="app"><div class="ld">보고서를 불러오는 중…</div></div>
<script>
var OLD="https://script.google.com/macros/s/AKfycbxW5BKDfh3tuWTYDIaZILVPCZwRA4Vbsk0i09XN6-eEpJgauQjHp_hn5AP7x_xM2_Ra/exec";
var app=document.getElementById("app");
function E(s){return String(s==null?"":s).replace(/[&<>"]/g,function(c){return{"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]})}
function gone(){app.innerHTML='<div class="msg">보고서 열람 기간이 지났어요.<br>학원으로 문의해 주세요.</div>'}
function call(u,k,ms){var c=window.AbortController?new AbortController():null,t=c&&setTimeout(function(){c.abort()},ms);
  return fetch(u,{method:"POST",redirect:"follow",headers:{"Content-Type":"text/plain;charset=utf-8"},body:JSON.stringify({a:"rpt",k:k}),signal:c?c.signal:undefined})
    .then(function(r){if(t)clearTimeout(t);return r.json()})}
function qi(c,k){var s="";for(var i=0;i<(+k||0);i++)s+='<i class="qi '+c+'"></i>';return s}
function cell(v){if(!v)return '<span class="none">–</span>';var s=qi("st",v.st)+qi("g",v.g)+qi("y",v.y)+qi("r",v.r)+qi("h",v.h)+qi("x",v.x);return s||'<span class="none">–</span>'}
function rcol(r){return r==null?"var(--sub)":r>=90?"#2f8a2f":r>=80?"#c98a00":"#d64545"}
// 총평 글은 학원이 쓴 것 — 굵게(<b>)만 남기고 나머지는 글자로
function safe(h){return E(h).replace(/&lt;(\/?)b&gt;/g,"<$1b>")}
function draw(r){
  if(!r||!r.ok||!r.d)return gone();var D=r.d,P=D.p2||{},h="";
  document.title=(D.name||"")+" "+(D.label||"")+" 보고서";
  h+='<header class="hd"><div class="brand"><i></i>라임라잇 스마트관</div><h1>내신 '+E(D.label)+' 학습 보고서</h1><div class="who"><b>'+E(D.name)+'</b><span>'+E(D.school)+E(D.grade)+' · '+E(D.exam)+' · '+E(D.span)+'</span></div></header>';
  h+='<section><h2>'+E(D.label)+' 학습 요약</h2><div class="kpi"><div><span>총 학습량</span><b>'+E(D.total)+'<small>문항</small></b></div><div><span>정답</span><b>'+E(D.correct)+'<small>문항</small></b></div><div class="hi"><span>정답률</span><b>'+E(D.rateTxt)+'<small>%</small></b>'+(D.chip?'<em>'+E(D.chip)+'</em>':'')+'</div></div></section>';
  h+='<section><h2>주요 학습 내용</h2><ol class="cards">'+(D.cards||[]).map(function(c){return '<li><b>'+E(c.t)+'</b><span>'+E(c.s)+'</span></li>'}).join("")+'</ol></section>';
  var bars=(D.sheets||[]).map(function(s){var p=s.n?Math.round(s.c/s.n*100):0,c=s.lv==="기본·실력"?"b":"h",nm=String(s.name||"").split(". ").slice(1).join(". ")||s.name;
    return '<div class="bar"><div class="bt"><b>'+E(nm)+'</b><em class="lv '+c+'">'+E(s.lv)+'</em><span>'+s.c+'/'+s.n+'</span><strong style="color:'+rcol(p)+'">'+p+'%</strong></div><div class="track"><i class="'+c+'" style="width:'+p+'%"></i></div></div>'}).join("");
  h+='<section><h2>학습지별 정답률</h2><div class="sub">'+(D.diff||[]).map(function(x){return E(x.k)+' '+x.n+'문항'}).join(" · ")+'</div>'+bars+'</section>';
  var rv=D.review||{};
  h+='<section><h2>'+E(D.label)+' 총평</h2><div class="rv"><div><em class="g">강점</em><p>'+safe(rv.strong)+'</p></div><div><em class="y">보완 포인트</em><p>'+safe(rv.weak)+'</p></div><div><em class="n">지도 방향</em><p>'+safe(rv.plan)+'</p></div></div></section>';
  var T=P.tiles||{},un="";
  (P.blocks||[]).forEach(function(b){un+='<h3>'+E(b.mid)+'</h3>';(b.rows||[]).forEach(function(r){var rate=r.rate;
    un+='<div class="unit"><div class="uh"><div><em>'+E(r.code)+'</em><b>'+E(r.name)+'</b></div><div class="rt"><small>완성도</small><strong style="color:'+rcol(rate)+'">'+(rate==null?"–":rate+"%")+'</strong></div></div>'+
      ["기본","실력","심화"].map(function(k){return '<div class="lvr"><span>'+k+'</span><div class="sq">'+cell((r.lv||{})[k])+'</div></div>'}).join("")+'</div>'})});
  var tl=[["st","완전한 이해",T.st],["g","이해도 높음",T.g],["y","보완 필요",T.y],["r","이해도 낮음",(T.r||0)+(T.h||0)],["x","판단 보류",T.x]]
    .map(function(a){return '<div><span><i class="qi '+a[0]+'"></i>'+a[1]+'</span><b>'+(a[2]||0)+'<small>개</small></b></div>'}).join("");
  h+='<section><h2>유형 이해도</h2><div class="tiles">'+tl+'</div>'+un+'</section>';
  var pl=P.plan||{};
  if((pl.rows||[]).length)h+='<section class="plan">'+pl.rows.map(function(x){return '<div class="pr'+(x.done?' dn':'')+'"><em>'+E(x.wk)+'</em><span>'+E(x.span)+'</span><b>'+E(x.u)+'</b>'+(x.done?'<i>완료</i>':'')+'</div>'}).join("")+
    '<div class="sch">'+(pl.sch||[]).map(function(s){return '<div><span>'+E(s.k)+'</span><b>'+E(s.v)+'</b></div>'}).join("")+'</div></section>';
  var fc=(P.focus||[]).map(function(x){return '<span>'+E(x.code)+' '+E(x.name)+' ('+E((x.lvs||[]).join("·"))+')</span>'}).join("");
  h+='<section class="fix"><h2>보완할 부분</h2><div class="chips">'+(fc||'<span>이번 주 범위에서 보완할 유형이 없어요.</span>')+'</div><p>'+E(pl.how)+'</p></section>';
  h+='<div class="call">궁금하신 점은 라임라잇 스마트관으로 편하게 연락 주세요.</div>';
  app.innerHTML='<div class="wrap">'+h+'</div>'}
var m=/[?&]k=([A-Za-z0-9]{32,64})\b/.exec(location.search),k=m&&m[1];
if(!k)gone();else call(OLD,k,40000).catch(function(){return call(OLD,k,40000)}).then(draw).catch(gone);
</script>
</body>
</html>
