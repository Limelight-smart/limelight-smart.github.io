<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<meta name="theme-color" content="#2eaf64">
<title>라임라잇 리모컨</title>
<link rel="icon" href="../assets/icon-director-192.png?v=1031">
<link rel="apple-touch-icon" href="../assets/icon-director-180.png?v=1031">
<!-- 원장 리모컨 화면 (지시서 011). 원본: 비공개 저장소 web/director/index.html → 공개 저장소 director/ 로 복사.
     학생 정보는 이 파일에 없다. 로그인(⚙선생님 '원장') 뒤 엔진 웹 앱이 보내 주는 것만 그린다. -->
<style>
*{box-sizing:border-box}html,body{margin:0}
body{background:#f5f7f6;color:#1e2a38;font-family:Pretendard,-apple-system,"Apple SD Gothic Neo","Malgun Gothic",system-ui,sans-serif;font-size:15px;line-height:1.5}
.wrap{max-width:720px;margin:0 auto;padding:16px 16px 40px}
.box{max-width:380px;margin:40px auto;background:#fff;border:1px solid #e4e8e5;border-radius:18px;padding:28px 22px}
.logo{display:block;height:84px;width:auto;margin:0 auto 12px}
h1{margin:0 0 20px;text-align:center;font-size:24px}
label{display:block;font-weight:700;margin:14px 0 6px}
input{display:block;width:100%;height:48px;border:1px solid #d8ded9;border-radius:12px;padding:0 14px;font-size:17px;background:#fff;color:inherit}
.big{width:100%;height:52px;margin-top:22px;border:0;border-radius:12px;background:#2eaf64;color:#fff;font-size:18px;font-weight:800}
button:disabled{opacity:.6}
.err{margin-top:12px;color:#c62828;font-weight:700;text-align:center;min-height:1em;white-space:pre-wrap}
.top{display:flex;align-items:center;gap:8px;margin-bottom:12px}
.top h2{margin:0;font-size:20px;flex:1}
.top small{color:#6b7480;font-weight:400;font-size:13px;display:block}
.sm{height:36px;padding:0 12px;border:1px solid #d8ded9;border-radius:10px;background:#fff;font-size:14px;font-weight:700;color:inherit}
.sum{display:flex;gap:8px;margin-bottom:12px}
.sum div{flex:1;background:#fff;border:1px solid #e4e8e5;border-radius:12px;padding:8px;text-align:center;font-size:13px;color:#6b7480}
.sum b{display:block;font-size:22px;color:#1e2a38}
.card{background:#fff;border:1px solid #e4e8e5;border-left:6px solid #2eaf64;border-radius:12px;padding:12px 14px;margin-bottom:10px}
.card.warn{border-left-color:#e8a317}.card.bad{border-left-color:#d93636}
.card h3{margin:0 0 4px;font-size:16px;display:flex;gap:6px;align-items:center}
.card h3 i{font-style:normal;font-size:12px;font-weight:800;padding:1px 7px;border-radius:8px;background:#e6f5ec;color:#1d7a45}
.card.warn h3 i{background:#fff4dc;color:#94650a}.card.bad h3 i{background:#fde8e8;color:#a32020}
.card li.gh{list-style:none;margin:8px 0 2px -18px;color:#1f2a44}
.card li .act{margin-left:6px;padding:2px 8px;border:1px solid #d5dbe3;border-radius:8px;background:#fff;font-size:12px;color:#1f2a44}
.card ul{margin:0;padding-left:18px;color:#3b4654;word-break:break-all}
.sec{margin:22px 0 8px;font-size:17px}
.btn{background:#fff;border:1px solid #e4e8e5;border-radius:12px;padding:12px 14px;margin-bottom:10px}
.btn button{height:42px;padding:0 16px;border:0;border-radius:10px;background:#2eaf64;color:#fff;font-size:15px;font-weight:800}
.btn p{margin:6px 0 0;color:#6b7480;font-size:13px}
.res{margin-top:8px;background:#f2f5f3;border-radius:8px;padding:8px 10px;font-size:13px;white-space:pre-wrap;word-break:break-all}
.log{font-size:13px;color:#3b4654;background:#fff;border:1px solid #e4e8e5;border-radius:12px;padding:10px 14px}
.log div{padding:4px 0;border-bottom:1px solid #eef1ef}.log div:last-child{border:0}
[hidden]{display:none!important}
</style>
</head>
<body>
<form class="box" id="f" hidden>
  <img class="logo" src="../assets/logo.png?v=1022" alt="라임라잇">
  <h1>원장 리모컨</h1>
  <label for="n">성함</label><input id="n" autocomplete="username" placeholder="예) 김라임">
  <label for="p">비밀번호 6자리 <small style="font-weight:400;color:#6b7480">(선생님 앱과 같음)</small></label><input id="p" type="password" inputmode="numeric" maxlength="6" autocomplete="current-password">
  <button class="big" id="b" type="submit">들어가기</button>
  <div class="err" id="e"></div>
</form>
<div class="wrap" id="main" hidden>
  <div class="top"><h2>리모컨<small id="now"></small></h2><button class="sm" id="r">새로고침</button><button class="sm" id="o">나가기</button></div>
  <div class="sum" id="sum"></div>
  <div id="cards"></div>
  <h3 class="sec">버튼</h3>
  <div id="btns"></div>
  <h3 class="sec">버튼 누른 기록</h3>
  <div class="log" id="log"></div>
</div>
<script>
(()=>{
const A="https://script.google.com/macros/s/AKfycbz4Cmsai2jiWPRMHShTQnkggvnHafFPexefpsuEV98GcUepIm32Wg90m61KH91fS4tn-w/exec",T="dr_token",L=localStorage,$=i=>document.getElementById(i);
const g=k=>{try{return L.getItem(k)}catch(e){return null}},s=(k,v)=>{try{L.setItem(k,v)}catch(e){}},d=k=>{try{L.removeItem(k)}catch(e){}};
const esc=t=>String(t==null?"":t).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const post=async b=>{const r=await fetch(A,{method:"POST",redirect:"follow",headers:{"Content-Type":"text/plain;charset=utf-8"},body:JSON.stringify(b)});return r.json()};
const LV={ok:"정상",warn:"확인",bad:"문제"};let ARG={};
const login=()=>{$("main").hidden=true;$("f").hidden=false};
// 017: 지난번 화면을 폰에 저장(dr_view, 나가기 때 지움) → 다음에 열면 바로 보이고, 카드 묶음 4개(a·b·c·d)를 동시에 받아 온 것부터 바꿔 그림
// 버튼은 저장하지 않는다(배치안 확인 창 목록은 늘 지금 것이어야 함) → d가 오면 그림
const V="dr_view",PARTS=["a","b","c","d"],ORD=["naealert","engine","before","autosync","matholic","weekly","mhdiff","stuout","classchk","noblock","triggers","mk_오늘","mk_내일","formula","mk","plan","planlog","pts","naemode","naesin","achv","goal","treq","calup","preq","pwreq","initpw"];
let view={},busy=0;
function draw(){
  const all=[];PARTS.forEach(k=>(view[k]&&view[k].cards||[]).forEach(x=>all.push(x)));
  const c={ok:0,warn:0,bad:0};all.forEach(x=>c[x.lv]=(c[x.lv]||0)+1);
  $("sum").innerHTML=["bad","warn","ok"].map(k=>"<div><b>"+c[k]+"</b>"+LV[k]+"</div>").join("");
  const ord={bad:0,warn:1,ok:2},ix=x=>{const i=ORD.indexOf(x.id);return i<0?99:i};
  $("cards").innerHTML=all.sort((a,b)=>(ord[a.lv]-ord[b.lv])||(ix(a)-ix(b))).map(x=>
    '<div class="card '+esc(x.lv)+'"><h3>'+esc(x.title)+"<i>"+LV[x.lv]+"</i></h3><ul>"+x.lines.map((l,i)=>{const a=x.acts&&x.acts[i];return l.slice(0,2)==="■ "?'<li class="gh"><b>'+esc(l.slice(2))+"</b></li>":"<li>"+esc(l).replace(/https:\/\/drive\.google\.com\/file\/d\/[\w-]+\/view/g,u=>'<a href="'+u+'" target="_blank" rel="noopener">사진 ↗</a>')+(a?' <button type="button" class="act" data-id="'+esc(a.id)+'" data-arg="'+esc(a.arg)+'" data-c="'+esc(a.c||"")+'">'+esc(a.t||"실행")+"</button>":"")+"</li>"}).join("")+(x.link&&/^https:\/\/docs\.google\.com\//.test(x.link)?'<li><a href="'+esc(x.link)+'" target="_blank" rel="noopener">탭 열기 ↗</a></li>':"")+"</ul></div>").join("")+(PARTS.some(k=>!view[k])?'<div class="card"><ul><li>불러오는 중…</li></ul></div>':"");
  const log=view.a&&view.a.log;
  $("log").innerHTML=log?(log.length?log.map(x=>"<div>"+(x.ok?"✔ ":"✖ ")+esc(x.at)+" · "+esc(x.who)+" · "+esc(x.title)+" ("+x.sec+"초)<br>"+esc(String(x.res).slice(0,160))+"</div>").join(""):"<div>아직 없음</div>"):"<div>불러오는 중…</div>";
}
function drawBtns(o){
  ARG={};o.buttons.forEach(b=>ARG[b.id]=b.arg);
  $("btns").innerHTML=o.buttons.map(b=>'<div class="btn"><button data-id="'+esc(b.id)+'" data-c="'+esc(b.confirm)+'" data-c2="'+esc(b.confirm2||"")+'">'+esc(b.title)+"</button><p>"+esc(b.desc)+'</p><div class="res" hidden></div></div>').join("");
}
function show(){$("f").hidden=true;$("main").hidden=false}
function load(fresh){
  if(busy)return;busy=PARTS.length;$("r").disabled=true;
  let saved=null;try{saved=JSON.parse(g(V)||"null")}catch(e){}
  if(saved&&!view.a){view=saved;show();draw();$("now").textContent=(saved.a&&saved.a.at||"")+" 저장된 화면 · 새로 받는 중…"}
  else $("now").textContent="새로 받는 중…";
  if(!view.d)$("btns").innerHTML='<div class="btn"><p>불러오는 중…</p></div>';
  const got={},fail=[];let authFail=false;
  PARTS.forEach(k=>post({a:"status",part:k,fresh:fresh?"1":"0",token:g(T)}).then(o=>{
    if(!o.ok){if(o.error==="auth")authFail=true;else fail.push(k);return}
    got[k]=o;view[k]={cards:o.cards,at:o.at,log:o.log};show();draw();if(k==="d")drawBtns(o);
  }).catch(()=>fail.push(k)).finally(()=>{
    if(--busy)return;$("r").disabled=false;
    if(authFail){view={};d(V);d(T);login();return}
    const at=got.a?got.a.now:"";s(V,JSON.stringify(view));
    $("now").textContent=fail.length?"일부 연결 실패 — 새로고침을 눌러 주세요":(at+" 기준");
    if(!view.a&&fail.length)$("now").textContent="연결 실패 — 새로고침을 눌러 주세요";
  }));
}
// v1025-02: 카드 줄 옆 작은 버튼(수업계획 변경 [되돌리기]) — 정해진 버튼 id만, 서버가 다시 확인
$("cards").addEventListener("click",async ev=>{
  const b=ev.target.closest("button.act");if(!b)return;
  if(b.dataset.c&&!confirm(b.dataset.c))return;
  b.disabled=true;const t=b.textContent;b.textContent="…";
  try{const o=await post({a:"run",token:g(T),id:b.dataset.id,arg:b.dataset.arg});
    if(o.error==="auth"){d(T);d(V);view={};login();return}
    alert((o.ok?"✔ ":"✖ ")+(o.res||o.error||""));if(o.ok){load(true);return}}
  catch(e){alert("연결 실패 — 새로고침 후 다시")}
  b.disabled=false;b.textContent=t;
});
$("btns").addEventListener("click",async ev=>{
  const b=ev.target.closest("button");if(!b)return;
  const arg=ARG[b.dataset.id];
  if(Array.isArray(arg)&&!arg.length){alert(b.dataset.c||"할 것이 없습니다");return}
  if(b.dataset.c&&!confirm(b.dataset.c))return;
  if(b.dataset.c2&&!confirm(b.dataset.c2))return; // 두 번째 확인(초기 비밀번호 전체 발송)
  const out=b.parentNode.querySelector(".res");b.disabled=true;out.hidden=false;out.textContent="실행 중… (1분 넘게 걸릴 수 있어요)";
  try{const o=await post({a:"run",token:g(T),id:b.dataset.id,arg:arg});
    if(o.error==="auth"){d(T);d(V);view={};login();return}
    out.textContent=(o.ok?"✔ 완료":"✖ 실패")+(o.sec!=null?" ("+o.sec+"초)":"")+"\n"+(o.res||o.error||"")}
  catch(e){out.textContent="연결 실패 — 결과는 새로고침 후 '버튼 누른 기록'에서 확인"}
  b.disabled=false;
});
$("f").addEventListener("submit",async ev=>{
  ev.preventDefault();$("b").disabled=true;$("e").textContent="";
  try{const o=await post({a:"login",name:$("n").value.trim(),pin:$("p").value.trim()});
    if(o.ok){s(T,o.token);$("p").value="";view={};load(true)}else $("e").textContent=o.error}
  catch(e){$("e").textContent="연결 실패"}
  $("b").disabled=false;
});
$("r").onclick=()=>load(true);
$("o").onclick=()=>{d(T);d(V);view={};login()};
if(g(T))load(false);else login();
})();
</script>
</body>
</html>
